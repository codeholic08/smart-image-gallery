<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/App.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>
<body class="mainmain">
    <div class="page">
        <div class="mainsection">
            <header class="page-header">
                <h1>Gallery AI</h1>
                <p class="subtitle">Search your photos with natural language</p>
                {% if demo_mode %}
                <p class="demo-badge">Demo mode &mdash; searching sample images, no AWS connected</p>
                {% endif %}
            </header>

            <div class="bar">
                <input id="searchbar" class="searchbar" type="text" placeholder="Search for photos..." title="Search">
            </div>

            <div class="buttons">
                <button onclick="searchPhotos()" class="button button-primary">Search Image</button>
                <button onclick="toggleUploadHandler()" class="button">Upload Image</button>
            </div>

            <div id="upload" class="upload-section">
                <div class="upload_photo_handler">
                    <h2>Upload Images</h2>
                    <input type="file" id="file" name="file">
                    <input type="text" id="labels" name="labels" placeholder="Custom labels (comma-separated)">
                    <button onclick="uploadPhotos()" class="button button-primary">Upload</button>
                </div>
            </div>
        </div>

        <div id="images" class="image-grid"></div>
    </div>
</body>
</html>
